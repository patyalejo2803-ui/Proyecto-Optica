<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óptica Alemana - Estado del pedido</title>
  <link rel="stylesheet" href="css/estado.css">
</head>
<body>

  <div class="pagina">

    <!-- ENCABEZADO -->
    <div class="encabezado">
      <div class="encabezado-icono">🔎</div>
      <h1>ÓPTICA ALEMANA</h1>
      <h2>Estado de mi pedido</h2>
      <p>Sigue el progreso de tu pedido</p>
    </div>

    <!-- ELEGIR PEDIDO -->
    <div class="seccion">
      <h3>Elige un pedido</h3>
      <div class="selector">
        <label for="selectorPedido">Pedido</label>
        <select id="selectorPedido">
          <option>Cargando…</option>
        </select>
      </div>
      <p class="mensaje" id="mensaje"></p>
    </div>

    <!-- INFORMACIÓN DEL PEDIDO -->
    <div class="seccion" id="seccionInfo" style="display:none;">
      <h3>Información del pedido</h3>

      <div class="fila">
        <span class="fila-label">Pedido #:</span>
        <span class="fila-valor" id="i-numero">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Servicio / producto:</span>
        <span class="fila-valor" id="i-producto">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Fecha:</span>
        <span class="fila-valor" id="i-fecha">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Estado:</span>
        <span class="badge" id="i-estado">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Pago:</span>
        <span class="badge" id="i-pago">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Total:</span>
        <span class="fila-valor" id="i-total">—</span>
      </div>
    </div>

    <!-- SEGUIMIENTO -->
    <div class="seccion" id="seccionSeguimiento" style="display:none;">
      <h3>Seguimiento</h3>
      <div class="progreso"><div class="progreso-barra" id="barra"></div></div>
      <p class="progreso-texto" id="textoProgreso">Progreso: 0%</p>
      <ul class="linea" id="linea"></ul>
    </div>

  </div>

  <!-- MENÚ INFERIOR -->
  <div class="menu-nav">
    <a href="login.html">🏠</a>
    <a href="citas.html">📅</a>
    <a href="pago.html">💳</a>
    <a href="pedidos.html">📦</a>
    <a href="estado.html" class="activo">🔎</a>
  </div>

  <script src="js/estado.js"></script>

</body>
</html>
