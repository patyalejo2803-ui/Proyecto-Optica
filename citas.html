<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óptica Alemana - Agendar cita</title>
  <link rel="stylesheet" href="css/citas.css">
</head>
<body>

  <div class="pagina">

    <div class="encabezado">
      <div class="encabezado-icono">📅</div>
      <h1>ÓPTICA ALEMANA</h1>
      <h2>Agendar cita</h2>
      <p>Reserva tu servicio en el horario que prefieras</p>
    </div>

    <div class="aviso" id="aviso"></div>

    <div class="seccion">
      <h3>Paso 1 — Elige el servicio</h3>
      <div class="campo">
        <label for="servicio">Servicio</label>
        <select id="servicio"><option value="">Cargando…</option></select>
      </div>
    </div>

    <div class="seccion">
      <h3>Paso 2 — Elige la fecha</h3>
      <div class="campo">
        <label for="fecha">Fecha de la cita</label>
        <input type="date" id="fecha">
      </div>
      <p class="nota">Atendemos de lunes a sábado.</p>
    </div>

    <div class="seccion">
      <h3>Paso 3 — Elige la hora</h3>
      <div class="horas" id="horas"></div>
      <p class="nota" id="notaHoras">Primero elige una fecha.</p>
    </div>

    <button class="btn-confirmar" id="btnConfirmar" disabled>Confirmar cita</button>

  </div>

  <div class="menu-nav">
    <a href="login.html">🏠</a>
    <a href="citas.html" class="activo">📅</a>
    <a href="pago.html">💳</a>
    <a href="pedidos.html">📦</a>
    <a href="estado.html">🔎</a>
  </div>

  <script src="js/citas.js"></script>

</body>
</html>
