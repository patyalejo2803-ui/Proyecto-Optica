<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óptica Alemana - Pedidos</title>
  <link rel="stylesheet" href="css/pedidos.css">
</head>
<body>

  <div class="pagina">

    <!-- ENCABEZADO -->
    <div class="encabezado">
      <div class="encabezado-icono">📦</div>
      <h1>ÓPTICA ALEMANA</h1>
      <h2>Pedidos</h2>
      <p>Consulta el estado de tus pedidos</p>
    </div>

    <!-- LISTA DE PEDIDOS (la llena js/pedidos.js) -->
    <div class="seccion">
      <h3>Mis Pedidos</h3>
      <div class="pedidos-lista" id="listaPedidos">
        <p>Cargando pedidos…</p>
      </div>
    </div>

    <!-- DETALLE DEL PEDIDO -->
    <div class="seccion" id="detalle-seccion">
      <h3>Detalle del Pedido</h3>

      <div class="fila">
        <span class="fila-label">Pedido #:</span>
        <span class="fila-valor" id="d-numero">—</span>
      </div>

      <div class="fila">
        <span class="fila-label">Servicio / producto:</span>
        <span class="fila-valor" id="d-producto">—</span>
      </div>

      <div class="fila">
        <span class="fila-label">Estado:</span>
        <span id="d-estado-badge" class="badge">—</span>
      </div>

      <div class="fila">
        <span class="fila-label">Pago:</span>
        <span id="d-pago-badge" class="badge">—</span>
      </div>

      <div class="fila">
        <span class="fila-label">Total:</span>
        <span class="fila-valor" id="d-total">—</span>
      </div>
    </div>

    <!-- BOTONES -->
    <div class="botones">
      <button class="btn-pagar" onclick="irAPagar()">Nuevo pedido</button>
      <button class="btn-estado" onclick="verEstado()">Ver estado</button>
    </div>

    <!-- PANEL DE ESTADO -->
    <div class="panel-estado" id="panel-estado">
      <h3>📦 Estado del Pedido</h3>
      <div class="fila">
        <span class="fila-label">Pedido</span>
        <span class="fila-valor" id="e-numero">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Servicio / producto</span>
        <span class="fila-valor" id="e-producto">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Estado actual</span>
        <span class="fila-valor" id="e-estado">—</span>
      </div>
      <div class="fila">
        <span class="fila-label">Pago</span>
        <span class="fila-valor" id="e-pago">—</span>
      </div>
    </div>

  </div>

  <!-- MENÚ INFERIOR -->
  <div class="menu-nav">
    <a href="login.html">🏠</a>
    <a href="citas.html">📅</a>
    <a href="pago.html">💳</a>
    <a href="pedidos.html" class="activo">📦</a>
  </div>

  <script src="js/pedidos.js"></script>

</body>
</html>
