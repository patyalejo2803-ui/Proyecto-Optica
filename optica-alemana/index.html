<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Óptica Alemana - Login</title>

  <!-- Enlace al archivo de estilos -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="tarjeta">

    <h1>Óptica Alemana</h1>
    <p class="subtitulo">¿Ya te has registrado? Ingresa aquí.</p>

    <form id="miFormulario" action="#" method="post">

      <!-- Campo Correo -->
      <label for="correo">Correo</label>
      <input type="email" id="correo" placeholder="hola@ejemplo.com" required>
      <p class="error" id="error-correo">Escribe un correo válido.</p>

      <!-- Campo Contraseña -->
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="••••••" required>
      <p class="error" id="error-clave">La contraseña debe tener mínimo 6 caracteres.</p>

      <!-- Botón -->
      <button type="button" onclick="validarFormulario()">Ingresar</button>

    </form>

    <!-- Mensaje de éxito -->
    <p class="mensaje-exito" id="mensaje-exito">
      ✅ ¡Bienvenido! Ingreso exitoso.
    </p>

    <!-- Link de registro -->
    <div class="link-registro">
      ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
    </div>

  </div>

  <!-- Enlace al archivo de JavaScript -->
  <script src="js/validacion.js"></script>

</body>
</html>
